services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexora-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    networks:
      - nexora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nexora-network

networks:
  nexora-network:
    driver: bridge
